<header class="kopf">
    <a routerLink="/" class="marke">Probetag</a>

    <nav aria-label="Hauptmenü">
        <a routerLink="/termine" routerLinkActive="aktiv">Termine</a>

        @if (isParticipant()) {
        <a routerLink="/meine-buchungen" routerLinkActive="aktiv">Meine Buchungen</a>
        }
        @if (isCompany()) {
        <a routerLink="/unternehmen" routerLinkActive="aktiv">Meine Termine</a>
        }
        @if (isAdmin()) {
        <a routerLink="/admin" routerLinkActive="aktiv">Freischaltungen</a>
        }
    </nav>

    <div class="konto">
        @if (authService.user(); as user) {
        <span class="email">{{ user.email }}</span>
        <button type="button" (click)="authService.logout()">Abmelden</button>
        } @else {
        <a routerLink="/login" routerLinkActive="aktiv">Anmelden</a>
        <a routerLink="/registrieren" class="registrieren">Registrieren</a>
        }
    </div>
</header>
